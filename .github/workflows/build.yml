name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install --user --upgrade buildozer

    - name: Build with Buildozer
      run: |
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
          sed -i 's/# title =/title = Adem Sadiki App/g' buildozer.spec
          sed -i 's/# package.name =/package.name = ademsadakiapp/g' buildozer.spec
          sed -i 's/# package.domain =/package.domain = org.ademsadiki/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,android/g' buildozer.spec
        fi
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
